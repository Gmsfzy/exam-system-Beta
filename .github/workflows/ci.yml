# 持续集成回归门（v5.22 建立，v5.30 修订矩阵）
# 目标：把本地门禁（全量 pytest + 前端 vite build）搬到 CI。
# 矩阵演进：v5.22 建门时依赖支持 3.10+3.12 双版本；后 numpy==2.5.3（requires_python>=3.12，
# PyPI 实测）与 pandas==3.0.5（>=3.11）抬高了地板，3.10/3.11 在 pip install 即失败，
# 故收敛为 3.12 单版本（与本地开发/部署基线一致）。语法漂移拦截由 compileall 步骤承担。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12']
    env:
      # config.py 在非 DEBUG 下对 SECRET_KEY fail-fast；CI 提供固定测试密钥，
      # 保持 DEBUG=false 的生产校验路径被真正执行。测试走临时/内存库，不触碰真实 DB。
      SECRET_KEY: ci-test-secret-key-not-for-production
      FLASK_DEBUG: 'false'
      # v5.36 显式声明探针时区：UTC runner 是暴露「测试依赖机器时区」的唯一环境
      # （v5.33 的 CI 红就是这么抓出来的）。写死 UTC0 而不是 Asia/Shanghai：
      # Windows CPython 不认 IANA 时区名（TZ=Asia/Shanghai 会被静默解析成偏移 0，
      # 与 TZ=Bogus/Nothing 结果一致且不报错），只有 POSIX 形式 UTC0 跨平台可信；
      # 生产口径由 utils/timeutil 的固定 +8 保证，与机器时区无关（见 test_time_contract_v5_36）。
      TZ: 'UTC0'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Syntax compile check (catch version-only syntax early)
        run: python -m compileall -q api homework competition bounty ledger dsci database utils ai_service config.py app.py

      - name: Run pytest
        run: python -m pytest -q

  frontend:
    name: Frontend build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
